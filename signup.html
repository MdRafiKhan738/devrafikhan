<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rafi Khan — Create account</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/pages.css"><link rel="stylesheet" href="css/rafi-theme.css"></head><body><div data-layout="header"></div><main><section class="p-hero" style="min-height:760px"><div class="container" style="padding-top:180px;padding-bottom:120px;max-width:760px"><p class="eyebrow gold hero-in">Portfolio access</p><h1 class="p-h1 hero-in">Create account</h1><form id="auth-form" class="contact-card hero-in"><div class="contact-card-in"><label class="field"><span class="meta">Name</span><input name="name" required placeholder="Your name"></label><label class="field"><span class="meta">Email</span><input name="email" type="email" required placeholder="Enter your email"></label><label class="field"><span class="meta">Password</span><input name="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><div class="contact-foot"><p>Already registered? <a class="text-link" href="login.html">Sign in</a></p><button class="btn btn-outline dark" type="submit"><span class="btn-txt">Create account</span></button></div><p id="auth-msg" class="form-msg" aria-live="polite"></p></div></form></div></section><div data-layout="footer"></div></main><script src="js/layout.js"></script><script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/umd/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/umd/ScrollTrigger.min.js"></script><script>document.getElementById("auth-form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.currentTarget),m=document.getElementById("auth-msg");const endpoint='/signup';try{const r=await fetch("https://devrafikhanbackend.onrender.com/api/auth"+endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok)throw new Error(d.message||"Request failed");localStorage.setItem("rafi-token",d.token);m.textContent="Account created successfully.";setTimeout(()=>location.href="index.html",500)}catch(err){m.textContent=err.message}});</script></body></html>

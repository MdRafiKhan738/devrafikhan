<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="api-base" content="https://devrafikhanbackend.onrender.com/api"/><title>Admin — Rafi Khan Portfolio</title><link rel="stylesheet" href="style.css"/><style>.admin-shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.admin-nav{border-right:1px solid var(--line);padding:28px;position:sticky;top:0;height:100vh}.admin-nav a,.admin-nav button{display:block;width:100%;padding:12px 0;text-align:left;color:var(--muted);border-bottom:1px solid var(--line)}.admin-nav a:hover,.admin-nav button:hover{color:var(--text)}.admin-main{padding:40px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid var(--line);padding:20px;background:rgba(255,255,255,.02)}.form-input{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:13px 14px;color:var(--text);outline:0;border-radius:8px}.form-input:focus{border-color:var(--purple)}textarea.form-input{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);padding:12px;display:flex;justify-content:space-between;gap:15px;margin-top:8px}.danger{color:#ff7272}.hide{display:none}@media(max-width:850px){.admin-shell{grid-template-columns:1fr}.admin-nav{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.admin-grid,.row{grid-template-columns:1fr}.admin-main{padding:20px}}</style></head><body><div class="admin-shell"><aside class="admin-nav"><div class="logo">Rafi <span>Admin</span></div><button data-tab="dashboard">Dashboard</button><button data-tab="projects">Projects</button><button data-tab="blogs">Blog</button><button data-tab="messages">Contact inbox</button><button data-tab="guestbook">Guest book</button><button data-tab="site">Site content</button><a href="index.html">← View website</a><button id="logout">Logout</button></aside><main class="admin-main"><section id="dashboard" class="tab"><span class="eyebrow">Admin</span><h1 style="font:400 64px/1 var(--serif);margin:15px 0 30px">Control <em style="color:var(--purple)">room.</em></h1><div class="admin-grid"><div class="panel"><div class="eyebrow">Projects</div><div id="projectCount" style="font:400 52px/1 var(--serif);margin-top:12px">0</div></div><div class="panel"><div class="eyebrow">Messages</div><div id="messageCount" style="font:400 52px/1 var(--serif);margin-top:12px">0</div></div></div></section><section id="projects" class="tab hide"><div class="section-head"><div><span class="eyebrow">Projects</span><h2>Project <em>manager.</em></h2></div></div><form id="projectForm" class="panel" style="display:grid;gap:10px"><input type="hidden" name="id"/><div class="row"><input class="form-input" name="title" placeholder="Project title" required/><input class="form-input" name="slug" placeholder="slug" required/></div><div class="row"><input class="form-input" name="category" placeholder="Category"/><input class="form-input" name="year" placeholder="Year"/></div><input class="form-input" name="summary" placeholder="Short summary"/><textarea class="form-input" name="description" placeholder="Description" rows="4"></textarea><textarea class="form-input" name="fullDescription" placeholder="Full project detail" rows="8"></textarea><div class="row"><input class="form-input" name="heroImage" placeholder="Hero image URL or data URL"/><input class="form-input" name="liveUrl" placeholder="Live URL"/></div><div class="row"><input class="form-input" name="githubUrl" placeholder="GitHub URL"/><input class="form-input" name="tags" placeholder="Tags comma-separated"/></div><div><label class="muted">Upload hero image<input class="form-input" type="file" id="projectImageFile" accept="image/*"/></label></div><div style="display:flex;gap:10px"><button class="btn btn-white">Save project</button><button type="button" class="btn btn-outline" id="newProject">New</button></div></form><div id="projectItems" style="margin-top:20px"></div></section><section id="blogs" class="tab hide"><div class="section-head"><div><span class="eyebrow">Blog</span><h2>Publish <em>insights.</em></h2></div></div><form id="blogForm" class="panel" style="display:grid;gap:10px"><input type="hidden" name="id"/><input class="form-input" name="title" placeholder="Title" required/><input class="form-input" name="slug" placeholder="slug" required/><input class="form-input" name="category" placeholder="Category"/><input class="form-input" name="coverImage" placeholder="Cover image URL or data URL"/><input class="form-input" type="file" id="blogCoverFile" accept="image/*"/><textarea class="form-input" name="excerpt" placeholder="Excerpt" rows="3"></textarea><textarea class="form-input" name="content" placeholder="HTML content" rows="14"></textarea><label><input type="checkbox" name="published" checked/> Published</label><button class="btn btn-white">Save post</button></form><div id="blogItems" style="margin-top:20px"></div></section><section id="messages" class="tab hide"><div class="section-head"><div><span class="eyebrow">Inbox</span><h2>Client <em>messages.</em></h2></div></div><div id="messageItems"></div></section><section id="guestbook" class="tab hide"><div class="section-head"><div><span class="eyebrow">Guest book</span><h2>Review <em>notes.</em></h2></div></div><div id="guestItems"></div></section><section id="site" class="tab hide"><div class="section-head"><div><span class="eyebrow">Content</span><h2>Site <em>settings.</em></h2></div></div><form id="siteForm" class="panel" style="display:grid;gap:10px"></form></section></main></div><script src="admin.js"></script></body></html>

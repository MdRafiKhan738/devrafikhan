<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rafi Admin</title><link rel="stylesheet" href="style.css"><style>.admin{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:25px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}.side button,.side a{display:block;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--muted);text-align:left}.main{padding:35px}.tabs>section{display:none}.tabs>section.active{display:block}.item{padding:12px;border:1px solid var(--line);margin:8px 0;display:flex;justify-content:space-between;gap:12px}.admin form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:800px){.admin{grid-template-columns:1fr}.side{position:static;height:auto}.row{grid-template-columns:1fr}}</style></head><body><div class="admin"><aside class="side"><div class="logo">Rafi <span>Admin</span></div><button data-tab="dashboard">Dashboard</button><button data-tab="projects">Projects</button><button data-tab="blogs">Blog</button><button data-tab="messages">Messages</button><button data-tab="guestbook">Guestbook</button><button data-tab="site">Site content</button><a href="index.html">View site</a><button id="logout">Logout</button></aside><main class="main"><div id="status" class="muted"></div><div class="tabs"><section id="dashboard" class="active"><span class="eyebrow">Dashboard</span><h1>Control <em>room.</em></h1><div class="admin-grid"><div class="panel"><span class="eyebrow">Projects</span><h2 id="projectCount">0</h2></div><div class="panel"><span class="eyebrow">Messages</span><h2 id="messageCount">0</h2></div></div></section><section id="projects"><h1>Project <em>manager.</em></h1><form id="projectForm" class="panel"><input type="hidden" name="id"><div class="row"><input class="form-input" name="title" placeholder="Title" required><input class="form-input"
